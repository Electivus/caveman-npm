name: Verify bundled runtime package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Fetch pinned upstream source
        shell: pwsh
        run: git clone --depth 1 --branch bin-v1.1.6 https://github.com/JuliusBrussee/caveman.git "$env:RUNNER_TEMP/caveman-source"
      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem ./scripts/*.ps1) {
            $errors = $null
            $tokens = $null
            [Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
      - name: Prepare signed artifacts and third-party notices
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Prepare-Package.ps1 -SourceRepo "$env:RUNNER_TEMP/caveman-source"
      - name: Test and pack
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Pack-Package.ps1
      - name: Install official CLI for isolated compatibility test
        shell: pwsh
        run: npm install -g --ignore-scripts @caveman-ai/cli@1.3.3
      - name: Verify offline npm install and real runtime discovery
        shell: pwsh
        run: |
          $artifact = Get-Content ./dist/artifact.json -Raw | ConvertFrom-Json
          ./scripts/Smoke-Package.ps1 -Tarball (Join-Path ./dist $artifact.filename)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-tarball-windows-x64
          path: |
            dist/*.tgz
            dist/artifact.json
          retention-days: 14
