name: Verify bundled runtime package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Fetch pinned upstream source
        shell: pwsh
        run: git clone --depth 1 --branch bin-v1.1.6 https://github.com/JuliusBrussee/caveman.git "$env:RUNNER_TEMP/caveman-source"
      - name: Prepare signed artifacts and third-party notices
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Prepare-Package.ps1 -SourceRepo "$env:RUNNER_TEMP/caveman-source"
      - name: Test and pack
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Pack-Package.ps1
      - name: Install official CLI for isolated compatibility test
        shell: pwsh
        run: npm install -g --ignore-scripts @caveman-ai/cli@1.3.3
      - name: Verify offline npm install and real runtime discovery
        shell: pwsh
        run: ./scripts/Smoke-Package.ps1 -Tarball ./dist/electivus-caveman-runtime-win32-x64-1.1.6.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-tarball-windows-x64
          path: |
            dist/*.tgz
            dist/artifact.json
          retention-days: 14
